<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ระบบจัดส่งประจำวัน — GV Dispatch</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="styles.css">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
  <div class="app">
    <!-- backdrop for mobile drawer -->
    <div class="backdrop" id="backdrop"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo-wrap"><img class="brand-logo" src="logo-dark.png" alt="GV Dispatch"></div>
        <div class="brand-cap">ศูนย์ควบคุมการจัดส่ง</div>
      </div>
      <nav class="nav scrolly" id="nav"><!-- built by JS --></nav>
      <div class="sidebar-foot">
        <a href="user-guide.html" target="_blank" class="nav-item" style="margin-bottom:6px"><i data-lucide="book-open"></i><span>คู่มือใช้งาน</span></a>
        <div class="sync-row"><span class="sync-dot" id="syncDot" style="background:#9AA3B2"></span><span id="syncText">กำลังเริ่มต้น…</span></div>
        <div class="sync-sub" id="syncSub">—</div>
      </div>
    </aside>

    <!-- MAIN -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn"><i data-lucide="menu"></i></button>
        <button class="date-btn" id="dateBtn">
          <i data-lucide="calendar-days"></i>
          <span class="dtext" id="dateLabel">วันนี้</span>
          <i data-lucide="chevron-down" style="width:16px;height:16px;color:#9AA3B2"></i>
        </button>
        <div class="search">
          <i data-lucide="search"></i>
          <input id="globalSearch" placeholder="ค้นหา PO, เลขบิล, ลูกค้า…" autocomplete="off">
        </div>
        <div class="spacer"></div>
        <div class="chip-sync"><span class="sync-dot" id="syncDot2" style="background:#9AA3B2"></span><span id="syncText2">—</span></div>
        <button class="btn btn-sm" id="driverModeBtn" title="เปิดโหมดคนขับ / QR ให้สแกน" style="gap:6px">
          <i data-lucide="smartphone"></i><span class="dtext">โหมดคนขับ</span>
        </button>
        <button class="bell"><i data-lucide="bell"></i><span class="badge" id="bellBadge">0</span></button>
        <div class="user">
          <div class="avatar"><i data-lucide="user"></i></div>
          <span class="dtext" style="font-size:14px;font-weight:500;color:#1F2533">หัวหน้างาน</span>
        </div>
      </header>
      <div id="hintBar" class="hintbar" style="display:none">
        <i data-lucide="info"></i>
        <span>เริ่มวันนี้: <b>เพิ่มงานส่ง → จัดรถ → ให้คนขับรับงาน</b> (ดู checklist ในหน้า “วันนี้”)</span>
        <button class="hint-btn" id="hintReload"><i data-lucide="list-checks"></i>ดูขั้นตอน</button>
        <button class="hint-x" id="hintClose" aria-label="ปิด"><i data-lucide="x"></i></button>
      </div>
      <main class="view scrolly" id="view"></main>
    </div>

    <!-- MOBILE BOTTOM NAV -->
    <nav class="mnav" id="mnav"></nav>
    <!-- DRIVER MODE BOTTOM NAV — shown instead of the sidebar/topbar/mnav above when body.driver-mode -->
    <nav class="dnav" id="dnav"></nav>
  </div>

  <div class="toast-wrap" id="toasts"></div>
  <div id="modalRoot"></div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
  <script src="app.pages.js"></script>
</body>
</html>
