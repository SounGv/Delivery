<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Delivery Dispatch & Route Control Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <!-- backdrop for mobile drawer -->
    <div class="backdrop" id="backdrop"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="gv-mark">GV</div>
        <div class="gv-word">GADGET VILLA</div>
        <div class="brand-cap">DISPATCH &amp; ROUTE CONTROL</div>
      </div>
      <nav class="nav scrolly" id="nav"><!-- built by JS --></nav>
      <div class="sidebar-foot">
        <a href="user-guide.html" target="_blank" class="nav-item" style="margin-bottom:6px"><i data-lucide="book-open"></i><span>คู่มือใช้งาน</span></a>
        <div class="sync-row"><span class="sync-dot" id="syncDot" style="background:#9AA3B2"></span><span id="syncText">กำลังเริ่มต้น…</span></div>
        <div class="sync-sub" id="syncSub">—</div>
      </div>
    </aside>

    <!-- MAIN -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn"><i data-lucide="menu"></i></button>
        <button class="date-btn" id="dateBtn">
          <i data-lucide="calendar-days"></i>
          <span class="dtext" id="dateLabel">วันนี้</span>
          <i data-lucide="chevron-down" style="width:16px;height:16px;color:#9AA3B2"></i>
        </button>
        <div class="search">
          <i data-lucide="search"></i>
          <input id="globalSearch" placeholder="ค้นหางานส่ง, ลูกค้า, เลขบิล…" autocomplete="off">
        </div>
        <div class="spacer"></div>
        <div class="chip-sync"><span class="sync-dot" id="syncDot2" style="background:#9AA3B2"></span><span id="syncText2">—</span></div>
        <button class="bell"><i data-lucide="bell"></i><span class="badge" id="bellBadge">0</span></button>
        <div class="user">
          <div class="avatar"><i data-lucide="user"></i></div>
          <span class="dtext" style="font-size:14px;font-weight:500;color:#1F2533">ผู้จัดการระบบ</span>
        </div>
      </header>
      <div id="hintBar" class="hintbar" style="display:none">
        <i data-lucide="info"></i>
        <span>เปิดครั้งแรกแล้วข้อมูลไม่ขึ้น หรือขึ้น "โหมดทดลอง"? กด <b>Ctrl + Shift + R</b> เพื่อล้างแคชแล้วโหลดใหม่</span>
        <button class="hint-btn" id="hintReload"><i data-lucide="refresh-cw"></i>โหลดใหม่</button>
        <button class="hint-x" id="hintClose" aria-label="ปิด"><i data-lucide="x"></i></button>
      </div>
      <main class="view scrolly" id="view"></main>
    </div>

    <!-- MOBILE BOTTOM NAV -->
    <nav class="mnav" id="mnav"></nav>
  </div>

  <div class="toast-wrap" id="toasts"></div>
  <div id="modalRoot"></div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
  <script src="app.pages.js"></script>
</body>
</html>
