<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GV ส่งของ">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="GV ส่งของ">
<meta name="theme-color" content="#F5F7FA">
<meta name="theme-color" media="(display-mode: standalone)" content="#0B1220">
<title>ระบบจัดส่งประจำวัน — GV Dispatch</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="styles.css?v=20260827b">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
</head>
<body>
  <div class="app">
    <!-- backdrop for mobile drawer -->
    <div class="backdrop" id="backdrop"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo-wrap"><img class="brand-logo" src="logo-dark.png" alt="GV Dispatch"></div>
        <div class="brand-cap">ศูนย์ควบคุมการจัดส่ง</div>
      </div>
      <nav class="nav scrolly" id="nav"><!-- built by JS --></nav>
      <div class="sidebar-foot">
        <div class="sync-row"><span class="sync-dot" id="syncDot" style="background:#9AA3B2"></span><span id="syncText">กำลังเริ่มต้น…</span></div>
        <div class="sync-sub" id="syncSub">—</div>
      </div>
    </aside>

    <!-- MAIN -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn"><i data-lucide="menu"></i></button>
        <div class="date-wrap" id="dateWrap">
          <button class="date-btn" id="dateBtn" type="button" aria-haspopup="true" aria-expanded="false">
            <i data-lucide="calendar-days"></i>
            <span class="dtext" id="dateLabel">วันนี้</span>
            <i data-lucide="chevron-down" class="date-chev"></i>
          </button>
          <div class="date-pop" id="datePop" hidden></div>
        </div>
        <div class="search">
          <i data-lucide="search"></i>
          <input id="globalSearch" placeholder="ค้นหา PO, เลขบิล, ลูกค้า…" autocomplete="off">
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="installTopBtn" title="ติดตั้งเมนูลัดหน้าจอ" aria-label="ติดตั้งเมนูลัดหน้าจอ" hidden><i data-lucide="download"></i></button>
          <button class="icon-btn" id="driverModeBtn" title="โหมดคนขับ / QR"><i data-lucide="smartphone"></i></button>
          <div class="avatar topbar-user" title="หัวหน้างาน"><i data-lucide="user"></i></div>
        </div>
      </header>
      <div class="install-banner" id="installBanner" hidden>
        <img class="install-banner-icon" src="icon-192.png" alt="" width="40" height="40">
        <div class="install-banner-text">
          <b>ติดตั้งเมนูลัดหน้าจอ</b>
          <span>เปิดเป็นแอปบนมือถือได้เลย ไม่ต้องหาแท็บเบราว์เซอร์</span>
        </div>
        <button type="button" class="btn btn-sm btn-primary" id="installBtn">ติดตั้ง</button>
        <button type="button" class="icon-btn install-banner-hide" id="installHide" aria-label="ปิด">×</button>
        <div class="install-ios-hint" id="installIosHint" hidden></div>
      </div>
      <main class="view scrolly" id="view"></main>
    </div>

    <!-- MOBILE BOTTOM NAV -->
    <nav class="mnav" id="mnav"></nav>
    <!-- DRIVER MODE BOTTOM NAV — shown instead of the sidebar/topbar/mnav above when body.driver-mode -->
    <nav class="dnav" id="dnav"></nav>
  </div>

  <div class="toast-wrap" id="toasts"></div>
  <div id="modalRoot"></div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js?v=20260827b"></script>
  <script src="app.pages.js?v=20260827b"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
