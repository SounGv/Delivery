# Cloudflare Pages project config — dispatch-center
# Deployed with the same non-interactive flow as deploy-cloudflare.ps1
# ($env:CLOUDFLARE_API_TOKEN / $env:CLOUDFLARE_ACCOUNT_ID), just adding a
# binding so functions/api/gas.js can reach D1 (env.DB).
# database_id is a resource identifier, not a secret — safe to commit
# (same as the Supabase project URL was, unlike a service-role key or password).
# POD photos stay on Google Drive via the existing Apps Script deployment
# (see lib/actions/pod.js) — R2 would need a billing subscription attached
# to the account, which the user opted to skip.

name = "gadgetvilla-delivery"
pages_build_output_dir = "."
compatibility_date = "2026-08-07"

[[d1_databases]]
binding = "DB"
database_name = "dispatch-center-db"
database_id = "d52ede73-0cec-4539-9aaa-a7973c489d0d"
